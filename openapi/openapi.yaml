components:
  schemas:
    Answer:
      additionalProperties: false
      properties:
        selected:
          items:
            type: string
          type: array
        text:
          type: string
      type: object
    Attachment:
      additionalProperties: false
      properties:
        caption:
          type: string
        id:
          type: string
        kind:
          enum:
            - image
            - video
            - audio
            - pdf
            - text
            - file
          type: string
        mediaType:
          type: string
        name:
          type: string
        path:
          type: string
        sent:
          description: The agent delivered this file on purpose
          type: boolean
        size:
          format: int64
          type: integer
      required:
        - id
        - name
        - mediaType
        - kind
      type: object
    BuildInfo:
      additionalProperties: false
      properties:
        commit:
          type: string
        date:
          type: string
        goVersion:
          type: string
        platform:
          type: string
        version:
          type: string
      required:
        - version
        - goVersion
        - platform
      type: object
    Choice:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    CommandBody:
      additionalProperties: false
      properties:
        command:
          description: A slash command such as /compact
          pattern: ^/
          type: string
      required:
        - command
      type: object
    CreateBody:
      additionalProperties: false
      properties:
        createDir:
          description: Create the directory if it does not exist
          type: boolean
        cwd:
          description: Working directory (absolute, or ~/...)
          minLength: 1
          type: string
        effort:
          type: string
        mode:
          type: string
        model:
          type: string
        options:
          $ref: "#/components/schemas/LaunchOptions"
        provider:
          enum:
            - claude
            - codex
          type: string
        title:
          type: string
      required:
        - provider
        - cwd
      type: object
    DirEntry:
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
      required:
        - name
        - path
      type: object
    DirListing:
      additionalProperties: false
      properties:
        dir:
          description: The directory listed
          type: string
        entries:
          items:
            $ref: "#/components/schemas/DirEntry"
          type: array
        exists:
          description: The requested path is an existing directory
          type: boolean
        parent:
          type: string
      required:
        - dir
        - exists
        - entries
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        attachments:
          items:
            $ref: "#/components/schemas/Attachment"
          type: array
        interrupted:
          type: boolean
        kind:
          description: Notice kind, diagnostic kind, lifecycle kind, or 'command' for a user_message that was a slash command
          type: string
        request:
          $ref: "#/components/schemas/Request"
        requestId:
          type: string
        resolution:
          enum:
            - client
            - external
            - cancelled
          type: string
        screen:
          type: string
        seq:
          description: Sequence number within the session, increasing
          format: int64
          type: integer
        text:
          type: string
        time:
          format: date-time
          type: string
        tool:
          $ref: "#/components/schemas/ToolEvent"
        type:
          enum:
            - user_message
            - assistant_text
            - thinking
            - tool_call
            - tool_result
            - files
            - turn_started
            - turn_completed
            - request
            - request_resolved
            - notice
            - restarted
            - diagnostic
            - error
            - exited
            - lifecycle
          type: string
      required:
        - seq
        - type
        - time
      type: object
    LaunchOptions:
      additionalProperties: false
      properties:
        bridge:
          description: "Claude: load the bridge mod"
          enum:
            - auto
            - "off"
          type: string
        chrome:
          description: "Claude: Claude in Chrome"
          enum:
            - default
            - "on"
            - "off"
          type: string
        interaction:
          description: "Claude: answer requests through hooks (default) or the TUI dialog"
          enum:
            - hook
            - terminal
          type: string
        remoteControl:
          description: "Claude: Remote Control"
          enum:
            - default
            - "on"
            - "off"
          type: string
        remoteControlName:
          type: string
        screenReader:
          description: "Claude: run with --ax-screen-reader"
          type: boolean
        search:
          description: "Codex: enable web search"
          type: boolean
        trustWorkspace:
          description: Accept the workspace trust dialog automatically
          type: boolean
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        token:
          type: string
      required:
        - token
      type: object
    Permission:
      additionalProperties: false
      properties:
        detail:
          type: string
        input: {}
        options:
          items:
            $ref: "#/components/schemas/PermissionOption"
          type: array
        toolName:
          type: string
      required:
        - options
      type: object
    PermissionOption:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
            - allow_once
            - allow_always
            - deny
            - other
          type: string
        label:
          type: string
      required:
        - id
        - label
        - kind
      type: object
    ProviderInfo:
      additionalProperties: false
      properties:
        displayName:
          type: string
        efforts:
          items:
            $ref: "#/components/schemas/Choice"
          type: array
        models:
          items:
            $ref: "#/components/schemas/Choice"
          type: array
        modes:
          items:
            $ref: "#/components/schemas/Choice"
          type: array
        name:
          type: string
        version:
          type: string
      required:
        - name
        - displayName
        - models
        - efforts
        - modes
      type: object
    Question:
      additionalProperties: false
      properties:
        allowText:
          type: boolean
        header:
          type: string
        id:
          type: string
        multiSelect:
          type: boolean
        options:
          items:
            $ref: "#/components/schemas/QuestionOption"
          type: array
        text:
          type: string
      required:
        - text
        - options
      type: object
    QuestionOption:
      additionalProperties: false
      properties:
        description:
          type: string
        label:
          type: string
      required:
        - label
      type: object
    Replayed:
      additionalProperties: false
      properties:
        firstSeq:
          description: Seq of the oldest replayed event (0 if none)
          format: int64
          type: integer
        hasMore:
          description: Older events exist; fetch them with getHistory
          type: boolean
      required:
        - hasMore
        - firstSeq
      type: object
    Request:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
            - permission
            - question
          type: string
        permission:
          $ref: "#/components/schemas/Permission"
        questions:
          items:
            $ref: "#/components/schemas/Question"
          type: array
        time:
          format: date-time
          type: string
        title:
          type: string
      required:
        - id
        - kind
        - time
        - title
      type: object
    RespondBody:
      additionalProperties: false
      properties:
        requestId:
          type: string
        response:
          $ref: "#/components/schemas/Response"
      required:
        - requestId
        - response
      type: object
    Response:
      additionalProperties: false
      properties:
        answers:
          description: Answers to a question request, index-aligned with its questions
          items:
            $ref: "#/components/schemas/Answer"
          type: array
        cancel:
          description: Dismiss the request
          type: boolean
        decision:
          description: Choose the first option of this kind when optionId is empty
          enum:
            - allow_once
            - allow_always
            - deny
            - other
          type: string
        message:
          description: Feedback for a denial
          type: string
        optionId:
          description: Permission option to choose
          type: string
      type: object
    SendBody:
      additionalProperties: false
      properties:
        text:
          minLength: 1
          type: string
      required:
        - text
      type: object
    ServerInfo:
      additionalProperties: false
      properties:
        authRequired:
          type: boolean
        authenticated:
          type: boolean
        home:
          description: The server user's home directory
          type: string
        idleTimeoutSeconds:
          description: Idle CLIs are stopped after this long; 0 = never
          format: int64
          type: integer
        version:
          $ref: "#/components/schemas/BuildInfo"
      required:
        - version
        - authRequired
        - authenticated
        - idleTimeoutSeconds
        - home
      type: object
    Session:
      additionalProperties: false
      properties:
        autoStopAt:
          description: When the idle CLI will be stopped, if nothing happens before
          format: date-time
          type: string
        cliSessionId:
          description: The CLI's conversation id
          type: string
        createdAt:
          format: date-time
          type: string
        cwd:
          type: string
        id:
          type: string
        lastActiveAt:
          format: date-time
          type: string
        lastSeq:
          description: Sequence number of the latest event
          format: int64
          type: integer
        options:
          $ref: "#/components/schemas/LaunchOptions"
        pending:
          items:
            $ref: "#/components/schemas/Request"
          type: array
        provider:
          type: string
        resumable:
          description: Starting the CLI continues the existing conversation
          type: boolean
        running:
          description: The CLI process is running
          type: boolean
        settings:
          $ref: "#/components/schemas/Settings"
        status:
          enum:
            - stopped
            - starting
            - idle
            - busy
            - waiting
          type: string
        title:
          type: string
      required:
        - id
        - provider
        - cwd
        - title
        - cliSessionId
        - status
        - running
        - resumable
        - settings
        - options
        - pending
        - createdAt
        - lastActiveAt
        - lastSeq
      type: object
    Settings:
      additionalProperties: false
      properties:
        effort:
          type: string
        mode:
          type: string
        model:
          type: string
        remoteControlUrl:
          type: string
      required:
        - model
        - effort
        - mode
      type: object
    SettingsBody:
      additionalProperties: false
      properties:
        effort:
          type: string
        mode:
          type: string
        model:
          type: string
      type: object
    TerminalData:
      additionalProperties: false
      properties:
        data:
          description: Base64 of the raw output
          type: string
      required:
        - data
      type: object
    TerminalInputRequest:
      additionalProperties: false
      properties:
        data:
          type: string
      required:
        - data
      type: object
    TerminalOffline:
      additionalProperties: false
      properties:
        offline:
          type: boolean
      required:
        - offline
      type: object
    TerminalReset:
      additionalProperties: false
      properties:
        cols:
          format: int64
          type: integer
        data:
          description: Base64 of the ANSI snapshot
          type: string
        rows:
          format: int64
          type: integer
      required:
        - cols
        - rows
        - data
      type: object
    ToolEvent:
      additionalProperties: false
      properties:
        id:
          type: string
        input: {}
        isError:
          type: boolean
        name:
          type: string
        output:
          type: string
        truncated:
          description: Output was cut to keep the history small
          type: boolean
      type: object
    UpdateSessionRequest:
      additionalProperties: false
      properties:
        title:
          maxLength: 200
          type: string
      required:
        - title
      type: object
    Workdir:
      additionalProperties: false
      properties:
        exists:
          type: boolean
        lastUsedAt:
          format: date-time
          type: string
        path:
          type: string
        useCount:
          format: int64
          type: integer
      required:
        - path
        - lastUsedAt
        - useCount
        - exists
      type: object
info:
  description: Run Claude Code and Codex sessions from the browser.
  title: agent-web
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log in with the access token
      tags:
        - system
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log out
      tags:
        - system
  /api/fs/dirs:
    get:
      description: If path is a directory, lists its subdirectories. Otherwise lists the subdirectories of its parent whose names start with its last element (autocompletion).
      operationId: listDirs
      parameters:
        - description: Absolute path or ~/...; empty means the home directory
          explode: false
          in: query
          name: path
          schema:
            description: Absolute path or ~/...; empty means the home directory
            type: string
        - description: Include hidden directories
          explode: false
          in: query
          name: hidden
          schema:
            description: Include hidden directories
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirListing"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subdirectories, for picking a working directory
      tags:
        - system
  /api/info:
    get:
      operationId: getInfo
      parameters:
        - in: cookie
          name: agent_web_session
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Server version and settings
      tags:
        - system
  /api/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProviderInfo"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Available CLIs with their models, efforts and modes
      tags:
        - system
  /api/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Session"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: All sessions, most recently active first
      tags:
        - sessions
    post:
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a session and start its CLI
      tags:
        - sessions
  /api/sessions/{id}:
    delete:
      operationId: deleteSession
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop the CLI and delete the session and its history
      tags:
        - sessions
    get:
      operationId: getSession
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: One session
      tags:
        - sessions
    patch:
      operationId: updateSession
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rename a session
      tags:
        - sessions
  /api/sessions/{id}/command:
    post:
      operationId: runCommand
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run a slash command (resumes the CLI if it was stopped)
      tags:
        - sessions
  /api/sessions/{id}/events:
    get:
      description: Sends a `summary`, replays stored events (the latest ones, or those after Last-Event-ID), sends `replayed`, then streams new `event`s and `summary` changes. Each event's SSE id is its seq.
      operationId: streamEvents
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
        - in: header
          name: Last-Event-ID
          schema:
            type: string
        - description: Replay events after this seq (like Last-Event-ID)
          explode: false
          in: query
          name: after
          schema:
            description: Replay events after this seq (like Last-Event-ID)
            format: int64
            type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/Event"
                        event:
                          const: event
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event event
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Replayed"
                        event:
                          const: replayed
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event replayed
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Session"
                        event:
                          const: summary
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event summary
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stream a session's events (SSE)
      tags:
        - sessions
  /api/sessions/{id}/files/{fileId}:
    get:
      operationId: getFile
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
        - in: path
          name: fileId
          required: true
          schema:
            type: string
        - description: Serve as an attachment instead of inline
          explode: false
          in: query
          name: download
          schema:
            description: Serve as an attachment instead of inline
            type: boolean
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The file
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: An image or file from the session's events
      tags:
        - sessions
  /api/sessions/{id}/history:
    get:
      operationId: getHistory
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
        - description: Return events with a smaller seq; 0 = the latest
          explode: false
          in: query
          name: before
          schema:
            description: Return events with a smaller seq; 0 = the latest
            format: int64
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 200
            format: int64
            maximum: 2000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Event"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Earlier events of a session
      tags:
        - sessions
  /api/sessions/{id}/interrupt:
    post:
      operationId: interruptSession
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Interrupt the running turn
