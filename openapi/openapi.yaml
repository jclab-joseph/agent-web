  /api/sessions/{id}/terminal:
    get:
      description: "`reset` carries a full-screen snapshot (sent first and whenever the CLI is relaunched), `data` raw output, `offline` that the CLI is not running."
      operationId: streamTerminal
      parameters:
        - description: Session id
          in: path
          name: id
          required: true
          schema:
            description: Session id
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/TerminalData"
                        event:
                          const: data
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event data
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/TerminalOffline"
                        event:
                          const: offline
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event offline
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/TerminalReset"
                        event:
                          const: reset
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          oneOf:
                            - type: integer
                            - type: string
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event reset
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stream the CLI's terminal (SSE)
      tags:
        - sessions
    post:
